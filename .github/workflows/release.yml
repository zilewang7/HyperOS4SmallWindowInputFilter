name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release and diag APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDiag --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            > 遇到问题可安装本 Release 中的 `io.github.zilewang7.smallwindow-*_debug_diag.apk` 诊断版复现。手势决策日志位于 `/data/system/smallwindow_filter.log`（root 可读），反馈问题时请附上该日志。

            > If you hit an issue, install the `io.github.zilewang7.smallwindow-*_debug_diag.apk` diagnostics build from this release. Gesture decisions are logged to `/data/system/smallwindow_filter.log` (root-readable); attach it when reporting.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/diag/*.apk
