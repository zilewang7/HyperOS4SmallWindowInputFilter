name: sync-store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (branch or tag) to build and sync, e.g. v1.1.0'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref || '' }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Read APK version
        id: meta
        run: |
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | tail -1)
          BADGING=$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk)
          VERCODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VERNAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "vercode=$VERCODE" >> "$GITHUB_OUTPUT"
          echo "vername=$VERNAME" >> "$GITHUB_OUTPUT"
          echo "APK: versionCode=$VERCODE versionName=$VERNAME"

      - name: Sync release to Xposed-Modules-Repo
        env:
          TOKEN: ${{ secrets.STORE_REPO_PAT }}
          STORE_REPO: Xposed-Modules-Repo/io.github.zilewang7.smallwindow
          VERCODE: ${{ steps.meta.outputs.vercode }}
          VERNAME: ${{ steps.meta.outputs.vername }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          # Store tag format: VersionCode-VersionName (spaces in name -> _)
          TAG="${VERCODE}-${VERNAME// /_}"
          ASSET_NAME="HyperOS4SmallWindowInputFilter-v${VERNAME}.apk"
          API="https://api.github.com/repos/${STORE_REPO}"
          AUTH="Authorization: Bearer ${TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          # Reuse an existing release if one with this tag already exists
          EXISTING=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/${TAG}" || true)
          if printf '%s' "$EXISTING" | grep -q '"id"'; then
            RELEASE_ID=$(printf '%s' "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "store release already exists: id=$RELEASE_ID"
          else
            BODY=$(python3 -c "
import json, os
body = os.environ.get('RELEASE_BODY') or 'Automated sync from source repository.'
payload = {'tag_name': os.environ['TAG'], 'name': os.environ['VERNAME'],
           'body': body, 'draft': False, 'prerelease': False}
print(json.dumps(payload))
")
            RESP=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" "$API/releases" -d "$BODY")
            echo "$RESP" | head -c 300; echo
            RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "created store release: id=$RELEASE_ID tag=$TAG"
          fi

          # Skip if the release already carries an APK asset
          ASSETS=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/${RELEASE_ID}/assets")
          if printf '%s' "$ASSETS" | grep -q '"browser_download_url"'; then
            echo "APK asset already present, skipping upload"
            exit 0
          fi

          curl -sS --retry 3 -X POST -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/${STORE_REPO}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"
          echo "APK uploaded to store release"
