name: sync-store

on:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN do not emit another workflow event.
  workflow_run:
    workflows: [release]
    types: [completed]
  # Maintainer-only recovery path for retrying a store sync by branch push.
  push:
    branches:
      - 'store-sync/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (branch or tag) to build and sync, e.g. v1.2.0'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_REF: ${{ github.event.inputs.ref }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            REF="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            REF="$WORKFLOW_HEAD_BRANCH"
          elif [ -n "$REQUESTED_REF" ]; then
            REF="$REQUESTED_REF"
          elif [[ "${GITHUB_REF_NAME}" == store-sync/* ]]; then
            REF="${GITHUB_REF_NAME#store-sync/}"
          else
            REF="$GITHUB_REF_NAME"
          fi
          if [[ "$REF" != v* ]]; then
            echo "Ref must be a release tag such as v1.2.0, got: $REF" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.14904198 cmake;3.22.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Read APK version
        id: meta
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          VERCODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VERNAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "vercode=$VERCODE" >> "$GITHUB_OUTPUT"
          echo "vername=$VERNAME" >> "$GITHUB_OUTPUT"
          echo "APK: versionCode=$VERCODE versionName=$VERNAME"

      - name: Sync release to Xposed-Modules-Repo
        env:
          TOKEN: ${{ secrets.STORE_REPO_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          STORE_REPO: Xposed-Modules-Repo/io.github.zilewang7.smallwindow
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          VERCODE: ${{ steps.meta.outputs.vercode }}
          VERNAME: ${{ steps.meta.outputs.vername }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Store tag format: VersionCode-VersionName (spaces in name -> _)
          TAG="${VERCODE}-${VERNAME// /_}"
          export TAG
          ASSET_NAME="io.github.zilewang7.smallwindow-${VERNAME}.apk"
          API="https://api.github.com/repos/${STORE_REPO}"
          AUTH="Authorization: Bearer ${TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          RELEASE_BODY=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "$ACCEPT" \
            "https://api.github.com/repos/${SOURCE_REPO}/releases/tags/${SOURCE_REF}" |
            python3 -c "import sys,json; print(json.load(sys.stdin).get('body') or 'Automated sync from source repository.')")
          export RELEASE_BODY

          # Reuse an existing release if one with this tag already exists
          EXISTING=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/${TAG}" || true)
          if printf '%s' "$EXISTING" | grep -q '"id"'; then
            RELEASE_ID=$(printf '%s' "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "store release already exists: id=$RELEASE_ID"
          else
            BODY=$(python3 -c "import json,os; print(json.dumps({'tag_name': os.environ['TAG'], 'name': os.environ['VERNAME'], 'body': os.environ.get('RELEASE_BODY') or 'Automated sync from source repository.', 'draft': False, 'prerelease': False}))")
            RESP=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" "$API/releases" -d "$BODY")
            echo "$RESP" | head -c 300; echo
            RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "created store release: id=$RELEASE_ID tag=$TAG"
          fi

          # Skip if the release already carries an APK asset
          ASSETS=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/${RELEASE_ID}/assets")
          if printf '%s' "$ASSETS" | grep -q '"browser_download_url"'; then
            echo "APK asset already present, skipping upload"
            exit 0
          fi

          curl -sS --retry 3 -X POST -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/${STORE_REPO}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"
          echo "APK uploaded to store release"
