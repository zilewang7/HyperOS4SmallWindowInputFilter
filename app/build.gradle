plugins {
    id "com.android.application"
}

android {
    namespace "io.github.zilewang7.smallwindow"
    compileSdk 37
    ndkVersion "30.0.14904198"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.github.zilewang7.smallwindow"
        minSdk 36
        targetSdk 37
        versionCode 4
        versionName "1.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
                targets "smallwindow_hyos"
            }
        }
    }

    sourceSets {
        main {
            // Kept in Git history as the 1.1.x fallback implementation, but
            // excluded from the native-only HyperOS 4 build.
            java.exclude "io/github/zilewang7/smallwindow/SmallWindowInputFilter.java"
        }
    }

    signingConfigs {
        // Real release signing when CI provides the keystore via env vars;
        // local builds without a keystore fall back to the debug key.
        release {
            if (System.getenv("KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
            externalNativeBuild {
                cmake {
                    arguments "-DSMALLWINDOW_DIAGNOSTIC=0"
                }
            }
        }
        release {
            minifyEnabled false
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
            signingConfig = (System.getenv("KEYSTORE_PATH") != null)
                    ? signingConfigs.release
                    : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DSMALLWINDOW_DIAGNOSTIC=0"
                }
            }
        }
        // Diagnostics variant: release-compatible signing in CI with native
        // file logging enabled for MiuiHome runtime issue reports.
        diag {
            debuggable true
            minifyEnabled false
            signingConfig = (System.getenv("KEYSTORE_PATH") != null)
                    ? signingConfigs.release
                    : signingConfigs.debug
            buildConfigField "boolean", "ENABLE_FILE_LOG", "true"
            versionNameSuffix "-diag"
            externalNativeBuild {
                cmake {
                    arguments "-DSMALLWINDOW_DIAGNOSTIC=1"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}

// Artifact naming convention: <applicationId>-<versionName>[_debug[_diag]].apk
// The release build has no type suffix, so it sorts FIRST in GitHub's
// alphabetical asset listing ('.' < '_'), with debug/diag below it.
//   io.github.zilewang7.smallwindow-1.2.0.apk
//   io.github.zilewang7.smallwindow-1.2.0_debug.apk
//   io.github.zilewang7.smallwindow-1.2.0_debug_diag.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def appId = android.defaultConfig.applicationId
            def ver = android.defaultConfig.versionName
            def name
            if (variant.name == "diag") {
                name = "${appId}-${ver}_debug_diag.apk"
            } else if (variant.name == "debug") {
                name = "${appId}-${ver}_debug.apk"
            } else {
                name = "${appId}-${ver}.apk"
            }
            output.outputFileName.set(name)
        }
    }
}
