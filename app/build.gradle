plugins {
    id "com.android.application"
}

android {
    namespace "io.github.zilewang7.smallwindow"
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.github.zilewang7.smallwindow"
        minSdk 36
        targetSdk 36
        versionCode 3
        versionName "1.1.0"
    }

    signingConfigs {
        // Real release signing when CI provides the keystore via env vars;
        // local builds without a keystore fall back to the debug key.
        release {
            if (System.getenv("KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
        }
        release {
            minifyEnabled false
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
            signingConfig = (System.getenv("KEYSTORE_PATH") != null)
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
        // Diagnostics variant: debug build with file logging enabled,
        // published alongside the release build.
        diag {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "ENABLE_FILE_LOG", "true"
            versionNameSuffix "-diag"
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}

dependencies {
    compileOnly files("stubs/inputfilter-stubs.jar")
}

// Artifact naming convention: <applicationId>-<buildType>-<versionName>.apk
// e.g. io.github.zilewang7.smallwindow-release-1.1.0.apk
//      io.github.zilewang7.smallwindow-debug-1.1.0.apk
//      io.github.zilewang7.smallwindow-debug-1.1.0-diag.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def appId = android.defaultConfig.applicationId
            def ver = android.defaultConfig.versionName
            if (variant.name == "diag") {
                output.outputFileName.set("${appId}-debug-${ver}-diag.apk")
            } else {
                output.outputFileName.set("${appId}-${variant.name}-${ver}.apk")
            }
        }
    }
}
