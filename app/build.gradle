plugins {
    id "com.android.application"
}

android {
    namespace "io.github.zilewang7.smallwindow"
    compileSdk 37

    defaultConfig {
        applicationId "io.github.zilewang7.smallwindow"
        minSdk 36
        targetSdk 36
        versionCode 3
        versionName "1.1.0"
    }

    signingConfigs {
        // Real release signing when CI provides the keystore via env vars;
        // local builds without a keystore fall back to the debug key.
        release {
            if (System.getenv("KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (System.getenv("KEYSTORE_PATH") != null)
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}

dependencies {
    compileOnly files("stubs/inputfilter-stubs.jar")
}

// Artifact naming convention: <applicationId>-<buildType>-<versionName>.apk
// e.g. io.github.zilewang7.smallwindow-release-1.1.0.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(
                    "${android.defaultConfig.applicationId}-${variant.name}-${android.defaultConfig.versionName}.apk")
        }
    }
}
