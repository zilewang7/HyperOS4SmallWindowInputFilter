plugins {
    id "com.android.application"
}

android {
    namespace "io.github.zilewang7.smallwindow"
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.github.zilewang7.smallwindow"
        minSdk 36
        targetSdk 36
        versionCode 3
        versionName "1.1.0"
    }

    signingConfigs {
        // Real release signing when CI provides the keystore via env vars;
        // local builds without a keystore fall back to the debug key.
        release {
            if (System.getenv("KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
        }
        release {
            minifyEnabled false
            buildConfigField "boolean", "ENABLE_FILE_LOG", "false"
            signingConfig = (System.getenv("KEYSTORE_PATH") != null)
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
        // Diagnostics variant: debug build with file logging enabled,
        // published alongside the release build.
        diag {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "ENABLE_FILE_LOG", "true"
            versionNameSuffix "-diag"
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}

dependencies {
    compileOnly files("stubs/inputfilter-stubs.jar")
}

// Artifact naming convention (short, mobile-friendly, release sorts first
// because GitHub lists release assets alphabetically and '.' < '_'):
//   smallwindow-1.1.0.apk            (release)
//   smallwindow-1.1.0_debug.apk      (debug)
//   smallwindow-1.1.0_debug_diag.apk (diagnostics)
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def ver = android.defaultConfig.versionName
            def name
            if (variant.name == "diag") {
                name = "smallwindow-${ver}_debug_diag.apk"
            } else if (variant.name == "debug") {
                name = "smallwindow-${ver}_debug.apk"
            } else {
                name = "smallwindow-${ver}.apk"
            }
            output.outputFileName.set(name)
        }
    }
}
